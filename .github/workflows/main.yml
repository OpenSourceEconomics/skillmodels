---
name: main
# Automatically cancel a previous run.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
jobs:
  run-tests:
    name: Run tests for ${{ matrix.os }} (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The three estimation tests in tests/test_chs_estimate.py take about four
      # minutes each; the rest of the suite takes about the same in total. They
      # run on their own Linux runners; the other legs deselect them.
      # yamllint disable rule:line-length
      matrix:
        include:
          - os: ubuntu-latest
            shard: rest
            pytest_args: >-
              tests --cov-report=xml --cov=./
              --deselect tests/test_chs_estimate.py::test_estimate_chs_returns_conforming_result
              --deselect tests/test_chs_estimate.py::test_estimate_chs_provides_ml_inference
              --deselect tests/test_chs_estimate.py::test_estimate_chs_enforces_user_fixed_constraint_value
          - os: ubuntu-latest
            shard: long-1
            pytest_args: >-
              tests/test_chs_estimate.py::test_estimate_chs_returns_conforming_result
              --cov-report=xml --cov=./
          - os: ubuntu-latest
            shard: long-2
            pytest_args: >-
              tests/test_chs_estimate.py::test_estimate_chs_provides_ml_inference
              --cov-report=xml --cov=./
          - os: ubuntu-latest
            shard: long-3
            pytest_args: >-
              tests/test_chs_estimate.py::test_estimate_chs_enforces_user_fixed_constraint_value
              --cov-report=xml --cov=./
          - os: macos-latest
            shard: rest
            pytest_args: >-
              tests -m 'not long_running'
              --deselect tests/test_chs_estimate.py::test_estimate_chs_returns_conforming_result
              --deselect tests/test_chs_estimate.py::test_estimate_chs_provides_ml_inference
              --deselect tests/test_chs_estimate.py::test_estimate_chs_enforces_user_fixed_constraint_value
          - os: windows-latest
            shard: rest
            pytest_args: >-
              tests -m 'not long_running'
              --deselect tests/test_chs_estimate.py::test_estimate_chs_returns_conforming_result
              --deselect tests/test_chs_estimate.py::test_estimate_chs_provides_ml_inference
              --deselect tests/test_chs_estimate.py::test_estimate_chs_enforces_user_fixed_constraint_value
      # yamllint enable rule:line-length
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.70.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Run pytest
        shell: bash -l {0}
        run: pixi run -e tests-cpu pytest ${{ matrix.pytest_args }}
      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  run-ty:
    name: Run ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.70.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true
          environments: type-checking
      - name: Run ty
        run: pixi run --locked -e type-checking prek run ty --all-files
        shell: bash -el {0}
