# ======================================================================================
# Build system configuration
# ======================================================================================
[build-system]
build-backend = "hatchling.build"
# ======================================================================================
# Project metadata
# ======================================================================================
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "skillmodels"
description = "Estimators for skill formation models"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
  "Econometrics",
  "Economics",
  "Estimation",
  "Skill formation",
  "Statistics",
]
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dynamic = [ "version" ]
dependencies = [
  # "dags>=0.5.0",
  "jax>=0.9",
  "jupyter-book>=2",
  "numpy",
  "optimagic>=0.5.3",
  "pandas",
  "pytask>=0.5.8",
  "pytask-parallel>=0.5.2",
]
[[project.authors]]
name = "Janoś Gabler"
email = "janos.gabler@gmail.com"
[[project.maintainers]]
name = "Janoś Gabler"
email = "janos.gabler@gmail.com"
[[project.maintainers]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@uni-bonn.de"
[project.urls]
Github = "https://github.com/OpenSourceEconomics/skillmodels"
Repository = "https://github.com/OpenSourceEconomics/skillmodels"
Tracker = "https://github.com/OpenSourceEconomics/skillmodels/issues"

[tool.hatch]
build.hooks.vcs.version-file = "src/skillmodels/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]
metadata.allow-direct-references = true
version.source = "vcs"

[tool.ruff]
fix = true
unsafe-fixes = false
[tool.ruff.lint]
select = [ "ALL" ]
extend-ignore = [
  "COM812",  # Conflicts with ruff-format
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "FIX002",  # Line contains TODO
  "ISC001",  # Conflicts with ruff-format
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY003",  # Long messages outside exception class
  "ANN401",
  "FBT002",
  "PD015",
  "PERF401",
  "PLR0913",
  "PLR2004",
  "S301",
]
per-file-ignores."**/*.ipynb" = [ "B018", "INP001", "T201" ]
per-file-ignores."src/skillmodels/types.py" = [ "TC" ]
per-file-ignores."src/skillmodels/visualize_*.py" = [ "BLE001" ]
per-file-ignores."tests/*" = [
  "ANN",
  "ARG001",
  "D100",
  "D103",
  "E712",
  "FBT003",
  "INP001",
  "PT011",
  "S101",
]
pydocstyle.convention = "google"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.14"
table_format = "long"
collapse_tables = [ "tool.hatch", "tool.pytest", "tool.pytask", "tool.ty" ]
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.environments",
  "tool.pixi.environments.cuda",
  "tool.pixi.environments.docs",
  "tool.pixi.environments.test-cpu",
  "tool.pixi.environments.test-gpu",
  "tool.pixi.environments.ty",
  "tool.pixi.feature",
  "tool.pixi.feature.cuda",
  "tool.pixi.feature.cuda.dependencies",
  "tool.pixi.feature.cuda.pypi-dependencies",
  "tool.pixi.feature.cuda.system-requirements",
  "tool.pixi.feature.cuda.tasks",
  "tool.pixi.feature.docs",
  "tool.pixi.feature.docs.dependencies",
  "tool.pixi.feature.docs.tasks",
  "tool.pixi.feature.test",
  "tool.pixi.feature.test.dependencies",
  "tool.pixi.feature.test.target",
  "tool.pixi.feature.test.tasks",
  "tool.pixi.feature.ty",
  "tool.pixi.feature.ty.pypi-dependencies",
  "tool.pixi.feature.ty.tasks",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.pypi-dependencies.optimagic",
  "tool.pixi.pypi-dependencies.skillmodels",
  "tool.pixi.workspace",
]

[tool.pytest]
ini_options.addopts = [ "--pdbcls=pdbp:Pdb" ]
ini_options.filterwarnings = []
ini_options.norecursedirs = [ "docs" ]

[tool.ty]
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.invalid-argument-type = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-return-type = "error"
rules.possibly-missing-attribute = "error"
rules.possibly-missing-implicit-call = "error"
rules.possibly-missing-import = "error"
rules.possibly-unresolved-reference = "error"
rules.redundant-cast = "error"
rules.undefined-reveal = "error"
rules.unresolved-global = "error"
rules.unsupported-base = "error"
rules.unused-ignore-comment = "error"
rules.useless-overload-body = "error"

[tool.pixi.dependencies]
filterpy = "*"
ipykernel = "*"
jupyterlab = "*"
nbformat = "*"
networkx = "*"
numpy = ">=2.3,<2.4"
plotly = ">=6.2"
prek = "*"
pybaum = "*"
python = "~=3.14.0"
python-kaleido = ">=1.0"
scipy = "*"

# Environments
# --------------------------------------------------------------------------------------
[tool.pixi.environments]
cuda = { features = [ "cuda" ], solve-group = "cuda" }
docs = { features = [ "docs" ], solve-group = "default" }
test-cpu = { features = [ "test" ], solve-group = "default" }
test-gpu = { features = [ "test", "cuda" ], solve-group = "cuda" }
ty = { features = [ "ty" ], solve-group = "default" }

# ======================================================================================
# Ruff configuration
# ======================================================================================
# Features and Tasks
# --------------------------------------------------------------------------------------
[tool.pixi.feature.cuda]
platforms = [ "linux-64" ]
system-requirements = { cuda = "12" }
[tool.pixi.feature.cuda.dependencies]
cuda-nvcc = ">=12"
[tool.pixi.feature.cuda.pypi-dependencies]
jax = { version = ">=0.7", extras = [ "cuda12" ] }
[tool.pixi.feature.cuda.tasks]
mem-cuda = """\
  pytest -x -s --pdb --memray --fail-on-increase \
  tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs\
  """
[tool.pixi.feature.docs.tasks]
build-docs = { cmd = "jupyter book build --html", cwd = "docs" }
view-docs = { cmd = "jupyter book start", cwd = "docs" }
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
snakeviz = "*"
[tool.pixi.feature.test.target.unix.dependencies]
pytest-memray = "*"
[tool.pixi.feature.test.tasks]
tests = "pytest tests"
tests-with-cov = "pytest tests --cov-report=xml --cov=./"
mem = """\
  pytest -x -s --pdb --memray --fail-on-increase \
  tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs\
  """
mem-on-clean-repo = """\
  git status --porcelain && git diff-index --quiet HEAD -- && git rev-parse HEAD && \
  pytest -x -s --pdb --memray --fail-on-increase \
  tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs\
  """
[tool.pixi.feature.ty.pypi-dependencies]
matplotlib = "*"  # required because of pandas
pandas-stubs = "*"
ty = "*"
types-pytz = "*"
[tool.pixi.feature.ty.tasks]
ty = "ty check src tests docs"
[tool.pixi.pypi-dependencies]
# optimagic = { git = "https://github.com/optimagic-dev/optimagic.git", branch = "main" }
dags = { git = "https://github.com/OpenSourceEconomics/dags", branch = "streamline-api" }
pdbp = "*"
skillmodels = { path = ".", editable = true }

# ======================================================================================
# Pixi configuration
# ======================================================================================
[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-arm64", "win-64" ]

# Development Dependencies (conda)
# --------------------------------------------------------------------------------------

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"
