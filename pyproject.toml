# ======================================================================================
# Project metadata
# ======================================================================================

[project]
name = "skillmodels"
authors = [
    { name = "Janoś Gabler", email = "janos.gabler@gmail.com" },
]
maintainers = [
    { name = "Janoś Gabler", email = "janos.gabler@gmail.com" },
    { name = "Hans-Martin von Gaudecker", email = "hmgaudecker@uni-bonn.de" },
]
description = "Estimators for skill formation models"
dynamic = ["version"]
keywords = [
    "Skill formation",
    "Econometrics",
    "Economics",
    "Estimation",
    "Statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "dags",
    "frozendict",
    "jax>=0.8",
    "numpy",
    "pandas",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT"

[project.urls]
Repository = "https://github.com/OpenSourceEconomics/skillmodels"
Github = "https://github.com/OpenSourceEconomics/skillmodels"
Tracker = "https://github.com/OpenSourceEconomics/skillmodels/issues"


# ======================================================================================
# Build system configuration
# ======================================================================================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "src/skillmodels/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
only-packages = true

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true


# ======================================================================================
# Pixi
# ======================================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Development Dependencies (conda)
# --------------------------------------------------------------------------------------

[tool.pixi.dependencies]
filterpy = "*"
ipykernel = "*"
jupyterlab = "*"
nbformat = "*"
networkx = "*"
numpy = ">=2.3,<2.4"
# optimagic = "*"
plotly = ">=6.2"
pre-commit = "*"
pybaum = "*"
python-kaleido = ">=1.0"
scipy = "*"

[tool.pixi.pypi-dependencies]
skillmodels = {path = ".", editable = true}
optimagic = { git = "https://github.com/optimagic-dev/optimagic.git", branch = "main"}
pdbp = "*"

# Features and Tasks
# --------------------------------------------------------------------------------------

[tool.pixi.feature.cuda]
platforms = ["linux-64"]
system-requirements = {cuda = "12"}

[tool.pixi.feature.cuda.dependencies]
cuda-nvcc = ">=12"

[tool.pixi.feature.cuda.pypi-dependencies]
jax = {version = ">=0.7", extras = ["cuda12"]}

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
snakeviz = "*"

[tool.pixi.feature.test.target.unix.dependencies]
pytest-memray = "*"


[tool.pixi.feature.test.tasks]
tests = "pytest tests"
tests-with-cov = "pytest tests --cov-report=xml --cov=./"
mem = "pytest -x -s --pdb --memray --fail-on-increase tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs"
mem-on-clean-repo = "git status --porcelain && git diff-index --quiet HEAD -- && git rev-parse HEAD && pytest -x -s --pdb --memray --fail-on-increase tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs"

[tool.pixi.feature.cuda.tasks]
mem-cuda = "pytest -x -s --pdb --memray --fail-on-increase tests/test_likelihood_regression.py::test_likelihood_contributions_large_nobs"

[tool.pixi.feature.ty.pypi-dependencies]
matplotlib = "*"  # required because of pandas
pandas-stubs = "*"
ty = "*"
types-PyYAML = "*"
types-pytz = "*"

[tool.pixi.feature.ty.tasks]
ty = "ty check src tests docs"

# Environments
# --------------------------------------------------------------------------------------

[tool.pixi.environments]
cuda = {features = ["cuda"], solve-group = "cuda"}
test-cpu = {features = ["test"], solve-group = "default"}
test-gpu = {features = ["test", "cuda"], solve-group = "cuda"}
ty = {features = ["test", "ty"], solve-group = "default"}

# ======================================================================================
# Ruff configuration
# ======================================================================================

[tool.ruff]
target-version = "py314"
fix = true
line-length = 88


[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed - too strict
    "B028", # No explicit `stacklevel` keyword argument found
    "COM812", # In conflict with formatter
    "D100", # Missing docstring in public module
    "D103", # missing docstring in public function
    "D104", # missing docstring in public package
    "EM101", # exception must not use a string literal
    "EM102", # exception must not use an f-string literal
    "FBT001", # Boolean-typed positional arguments.
    "FBT002", # Boolean default positional argument in function definition
    "FIX002", # line contains a todo
    "ISC001", # In conflict with formatter
    "NPY002", # Leave Numpy's legacy RNG
    "PD008", # array.at is perfectly valid Jax, but linter thinks it's Pandas...
    "PD015", # pd.merge is fine
    "PERF401", # Many suggestions to use list comprehension are not helpful
    "PLR2004", # Magic values are fine
    "PLR0913", # Too many arguments to function call
    "RET504", # Assignment before return statement is fine.
    "S101", # use of `assert` detected
    "S301", # `pickle` module is unsafe
    "SLF001", # Private member accessed: `_stochastic_info`
    "TRY003", # long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"src/skillmodels/types.py" = ["TC"]  # Dataclasses need types at runtime
"src/skillmodels/visualize_*.py" = ["BLE001"]
"**/*.ipynb" = ["B018", "T201", "E402", "PLR2004", "INP001", "PTH100"]
"docs/**/*" = ["A001", "ERA001", "INP001", "PTH100", "PTH123", "S506"]
"tests/*" = [
    "ANN",  # Tests don't need type annotations
    "ARG001",
    "E712",
    "FBT003",
    "INP001",
    "PD002",
    "PT011",
    "NPY002",
    "PTH123",
    "S506"
]

[tool.ruff.lint.pydocstyle]
convention = "google"


# ======================================================================================
# ty configuration
# ======================================================================================

[tool.ty.rules]
invalid-return-type = "error"
ambiguous-protocol-member = "error"
deprecated = "error"
division-by-zero = "error"
ignore-comment-unknown-rule = "error"
invalid-argument-type = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"


[tool.pytest.ini_options]
markers = [
    "wip: Tests that are work-in-progress.",
    "unit: Flag for unit tests which target mainly a single function.",
    "integration: Flag for integration tests which may comprise of multiple unit tests.",
    "end_to_end: Flag for tests that cover the whole program.",
]
norecursedirs = ["docs", ".envs"]


# ======================================================================================
# yamlfix configuration
# ======================================================================================

[tool.yamlfix]
line_length = 88
sequence_style = "block_style"
none_representation = "null"
